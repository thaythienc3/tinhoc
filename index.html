<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - Gameshow Trắc Nghiệm</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #1e3c72, #2a52be); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; color: white; }
        .login-card { background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 15px; backdrop-filter: blur(10px); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; background: rgba(255, 255, 255, 0.2); color: white; font-size: 16px; outline: none; box-sizing: border-box;}
        input::placeholder { color: #ddd; }
        button { width: 100%; padding: 12px; background: #ff9800; border: none; border-radius: 5px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #e68900; }
        .error { color: #ff5252; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🎮 ĐẤU TRƯỜNG TRẮC NGHIỆM</h2>
        <input type="text" id="username" placeholder="Mã tài khoản (Username)">
        <input type="password" id="password" placeholder="Mật khẩu (Password)">
        <button onclick="login()">VÀO PHÒNG CHỜ</button>
        <div id="error" class="error"></div>
    </div>
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw896OgbCk16JJBN3heyOZ26N1OwaLTNhGnzkb7b1dNCTBDL06McnL3dW0yp5nwkxFI_Q/exec";
        async function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if(!user || !pass) { document.getElementById('error').innerText = "Vui lòng nhập đầy đủ thông tin!"; return; }
            
            document.getElementById('error').innerText = "Đang kết nối...";
            try {
                let res = await fetch(`${API_URL}?action=login&user=${user}&pass=${pass}`);
                let data = await res.json();
                if(data.status === "success") {
                    localStorage.setItem("user", user);
                    localStorage.setItem("fullName", data.fullName);
                    
                    // Chuyển sang trang phòng chờ kiểm tra trạng thái game
                    checkGameRoom();
                } else {
                    document.getElementById('error').innerText = "Sai tài khoản hoặc mật khẩu!";
                }
            } catch(e) {
                document.getElementById('error').innerText = "Lỗi kết nối hệ thống!";
            }
        }

        async function checkGameRoom() {
            document.body.innerHTML = `<div style="text-align:center"><h2>🎉 Đăng nhập thành công! Chào ${localStorage.getItem("fullName")}</h2><p>Đang chờ Quản trị viên mở phòng thi...</p><h1 id="countdown">⏳</h1></div>`;
            setInterval(async () => {
                let res = await fetch(`${API_URL}?action=getStatus`);
                let status = await res.text();
                if(status.trim() === "STARTED") {
                    window.location.href = "quiz.html";
                }
            }, 2000);
        }
    </script>
</body>
</html>
