<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Điều Phối Gameshow</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 50px; }
        .btn-start { background: #4CAF50; color: white; font-size: 24px; padding: 20px 40px; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 0 20px rgba(76,175,80,0.5); }
        .btn-reset { background: #f4433n; color: white; font-size: 20px; padding: 15px 30px; border: none; border-radius: 10px; cursor: pointer; margin-top: 20px; }
        h1 { color: #ffeb3b; }
    </style>
</head>
<body>
    <h1>🛠️ BẢNG ĐIỀU KHIỂN QUẢN TRỊ GAMESHOW</h1>
    <p>Nhấn nút bắt đầu để toàn bộ 50 học sinh cùng lúc bước vào phòng thi thức chiến!</p>
    <br><br>
    <button class="btn-start" onclick="startGame('STARTED')">🚀 BẮT ĐẦU CUỘC THI NGAY</button>
    <br><br>
    <button class="btn-start" style="background:#e91e63;" onclick="startGame('WAITING')">⏸️ ĐẶT LẠI TRẠNG THÁI CHỜ</button>
    <h3 id="statusMsg" style="margin-top: 30px;">Trạng thái hiện tại: Đang chờ</h3>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbw896OgbCk16JJBN3heyOZ26N1OwaLTNhGnzkb7b1dNCTBDL06McnL3dW0yp5nwkxFI_Q/exec";
        async function startGame(status) {
            let res = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "setStatus", status: status })
            });
            let data = await res.json();
            if(data.status === "success") {
                document.getElementById('statusMsg').innerText = "Trạng thái hiện tại: " + (status === 'STARTED' ? "ĐÃ BẮT ĐẦU THI!" : "ĐANG CHỜ...");
                alert("Đã cập nhật trạng thái game thành công!");
            }
        }
    </script>
</body>
</html>
