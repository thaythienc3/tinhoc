<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bảng Điều Phối Gameshow (Admin Dashboard)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 30px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1e293b; border: 2px solid #334155; padding: 25px; border-radius: 12px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 6px; box-sizing: border-box; }
        .btn { padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin: 5px 0; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-red { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <h1>🎛️ TRUNG TÂM ĐIỀU HÀNH GAMESHOW (MC & KỸ THUẬT)</h1>
    
    <div class="dashboard-grid">
        <!-- Điều khiển Trò chơi -->
        <div class="card">
            <h3>⚡ Điều Khiển Vòng Thi Trực Tiếp</h3>
            <p>Trạng thái hiện tại: <span id="status-game" style="color: #facc15; font-weight:bold;">Đang chờ</span></p>
            <button class="btn btn-green" onclick="updateState('STARTED')">🚀 Bắt Đầu Cuộc Thi</button>
            <button class="btn btn-red" onclick="updateState('PAUSED')">⏸️ Tạm Dừng Phòng Thi</button>
            <hr style="border-color:#334155; margin:20px 0;">
            <h4>Điều hướng câu hỏi cho MC:</h4>
            <button class="btn btn-blue" onclick="changeQuestion('next')">➡️ Chuyển Câu Tiếp Theo</button>
            <button class="btn btn-blue" onclick="changeQuestion('prev')">⬅️ Quay Lại Câu Trước</button>
        </div>

        <!-- Nhập Ngân Hàng Câu Hỏi -->
        <div class="card">
            <h3>📚 Thêm Ngân Hàng Câu Hỏi (Google Sheets)</h3>
            <input type="text" id="q-id" placeholder="ID Câu hỏi (vd: Q101)">
            <input type="text" id="q-text" placeholder="Nội dung câu hỏi">
            <input type="text" id="opt-a" placeholder="Đáp án A">
            <input type="text" id="opt-b" placeholder="Đáp án B">
            <input type="text" id="opt-c" placeholder="Đáp án C">
            <input type="text" id="opt-d" placeholder="Đáp án D">
            <select id="correct-ans">
                <option value="A">Đáp án đúng: A</option>
                <option value="B">Đáp án đúng: B</option>
                <option value="C">Đáp án đúng: C</option>
                <option value="D">Đáp án đúng: D</option>
            </select>
            <button class="btn btn-green" style="width:100%;" onclick="addNewQuestion()">➕ Đưa vào Ngân Hàng Google Sheet</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzlu1N6He2-xIoEXKRf8rmEASZgBbpO-LuKqCDyRCNYxi54WImLUqfMeMhPwzOgP6AsKg/exec";

        async function updateState(stateVal) {
            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "setState", state: { status: stateVal } })
            });
            document.getElementById('status-game').innerText = stateVal;
            alert("Đã cập nhật trạng thái game thành công!");
        }

        async function addNewQuestion() {
            let data = {
                action: "addQuestion",
                id: document.getElementById('q-id').value,
                question: document.getElementById('q-text').value,
                optA: document.getElementById('opt-a').value,
                optB: document.getElementById('opt-b').value,
                optC: document.getElementById('opt-c').value,
                optD: document.getElementById('opt-d').value,
                correct: document.getElementById('correct-ans').value
            };
            let res = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
            alert("Đã thêm câu hỏi vào cơ sở dữ liệu Google Sheet thành công!");
        }

        function changeQuestion(dir) {
            alert("Đã gửi lệnh " + dir + " tới màn hình sân khấu và học sinh!");
        }
    </script>
</body>
</html>
