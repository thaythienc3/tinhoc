<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phòng Thi Trắc Nghiệm - Gameshow</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 850px; background: #1e293b; padding: 40px; border-radius: 20px; border: 3px solid #3b82f6; box-shadow: 0 0 30px rgba(59, 130, 246, 0.4); }
        .btn-opt { width: 100%; background: #334155; border: 2px solid #475569; padding: 18px; border-radius: 12px; font-size: 18px; color: white; cursor: pointer; text-align: left; margin: 10px 0; font-weight: bold; transition: 0.2s; }
        .btn-opt:hover { background: #475569; border-color: #60a5fa; }
        .btn-opt.selected { background: #2563eb; border-color: #93c5fd; }
        .action-row { display: flex; justify-content: space-between; margin-top: 20px; }
        .btn-action { padding: 12px 25px; border-radius: 8px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; }
        .warning-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; display:flex; justify-content:center; align-items:center; flex-direction:column; display:none; }
    </style>
</head>
<body>
    <div class="container" id="quiz-box">
        <h3 id="info-student" style="color:#38bdf8; margin-top:0;">Thí sinh: ...</h3>
        <h2 id="q-text">Đang tải câu hỏi...</h2>
        <div id="options-container"></div>
        
        <div class="action-row">
            <button class="btn-action" style="background:#f59e0b; color:white;" onclick="skipQuestion()">⏩ Bỏ qua câu này (Next)</button>
            <button class="btn-action" style="background:#10b981; color:white;" onclick="confirmAnswer()">💾 Gửi đáp án & Tiếp theo</button>
        </div>
    </div>

    <div class="warning-overlay" id="warn-screen">
        <h1 style="color:#ef4444;">⚠️ CẢNH BÁO VI PHẠM QUY CHẾ THI</h1>
        <p id="warn-text" style="font-size:20px; text-align:center; max-width:600px;"></p>
        <button onclick="closeWarning()" style="padding:12px 25px; background:#3b82f6; border:none; color:white; border-radius:8px; font-size:16px; cursor:pointer;">Tôi đã hiểu, quay lại thi</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzlu1N6He2-xIoEXKRf8rmEASZgBbpO-LuKqCDyRCNYxi54WImLUqfMeMhPwzOgP6AsKg/exec";
        let questions = [], currentIndex = 0, selectedOption = null, cheatCount = 0;
        
        document.getElementById('info-student').innerText = `Thí sinh: ${localStorage.getItem('fullName')} (SBD: ${localStorage.getItem('sbd') || '01'})`;

        async function init() {
            let res = await fetch(`${API_URL}?action=getQuiz&count=20`);
            questions = await res.json();
            renderQuestion();
        }

        function renderQuestion() {
            if(currentIndex >= questions.length) { alert("Bạn đã hoàn thành bài thi!"); return; }
            let q = questions[currentIndex];
            document.getElementById('q-text').innerText = `Câu ${currentIndex + 1}: ${q.question}`;
            selectedOption = null;
            
            let html = '';
            for(let key in q.options) {
                html += `<button class="btn-opt" onclick="selectOpt('${key}')" id="opt-${key}"><b>${key}.</b> ${q.options[key]}</button>`;
            }
            document.getElementById('options-container').innerHTML = html;
        }

        function selectOpt(key) {
            selectedOption = key;
            document.querySelectorAll('.btn-opt').forEach(b => b.classList.remove('selected'));
            document.getElementById(`opt-${key}`).classList.add('selected');
        }

        async function confirmAnswer() {
            if(!selectedOption) { alert("Vui lòng chọn 1 đáp án!"); return; }
            let q = questions[currentIndex];
            let isCorrect = (selectedOption === q.correct);
            
            // Gửi dữ liệu ngầm lên Google Sheet
            await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "submitAnswer",
                    username: localStorage.getItem("user"),
                    fullName: localStorage.getItem("fullName"),
                    questionId: q.id,
                    selectedOption: selectedOption,
                    isCorrect: isCorrect
                })
            });
            currentIndex++;
            renderQuestion();
        }

        function skipQuestion() {
            currentIndex++;
            renderQuestion();
        }

        // Chống gian lận: Phát hiện rời màn hình
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                cheatCount++;
                if(cheatCount === 1) {
                    document.getElementById('warn-text').innerText = "Cảnh cáo lần 1: Bạn đã rời khỏi màn hình làm bài thi! Vi phạm lần 2 hệ thống tự động khóa tài khoản và nộp bài 0 điểm.";
                    document.getElementById('warn-screen').style.display = 'flex';
                } else if(cheatCount >= 2) {
                    alert("Bạn đã vi phạm 2 lần. Hệ thống tự động khóa bài thi!");
                    window.location.href = "index.html";
                }
            }
        });
        function closeWarning() { document.getElementById('warn-screen').style.display = 'none'; }

        init();
    </script>
</body>
</html>
